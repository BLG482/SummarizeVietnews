# Chỉ chạy cơ sở dữ liệu PostgreSQL. Backend chạy trực tiếp trên máy để dùng GPU dễ hơn.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: summarizer
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
